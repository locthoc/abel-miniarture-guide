<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foamex Miniature Viewer</title>
<link rel="stylesheet" href="style.css">
<style id="page-size"></style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<header class="bar">
  <div class="brand">
    <span class="mark"></span>
    <div>
      <h1 id="project">Miniature</h1>
      <p class="sub">Foamex cut &amp; assembly viewer</p>
    </div>
  </div>
  <div class="controls">
    <div class="chips" id="filter-chips" role="group" aria-label="Filter"></div>
    <label class="slider">Explode
      <input type="range" id="explode" min="0" max="1" step="0.01" value="0">
    </label>
    <button id="reset-view" class="btn">Reset view</button>
  </div>
</header>

<main class="layout">
  <section class="pane pane-3d">
    <div class="pane-head"><span class="tag">3D</span>
      <button class="btn small" id="guide-toggle" aria-pressed="true">Hide controls</button></div>
    <div id="viewport">
      <ul class="nav-guide" aria-label="3D navigation">
        <li><span class="key">Left-drag</span> Rotate</li>
        <li><span class="key">Right-drag</span> Pan (shift camera)</li>
        <li><span class="key">Scroll</span> Zoom</li>
        <li><span class="key">Click</span> Select part</li>
      </ul>
    </div>
  </section>

  <section class="pane pane-2d">
    <div class="pane-head">
      <span class="tag">Blueprint</span>
      <div class="sheet-nav">
        <button class="btn icon" id="sheet-prev" aria-label="Previous sheet">◀</button>
        <select id="sheet-select" aria-label="Sheet"></select>
        <button class="btn icon" id="sheet-next" aria-label="Next sheet">▶</button>
      </div>
      <div class="actions">
        <div class="zoom" role="group" aria-label="Blueprint zoom">
          <button class="btn icon" id="zoom-out" aria-label="Zoom out">−</button>
          <button class="btn icon" id="zoom-in" aria-label="Zoom in">+</button>
          <button class="btn" id="zoom-fit">Fit</button>
        </div>
        <a class="btn" id="dl-svg" download>SVG</a>
        <button class="btn primary" id="print">Print 1:1</button>
      </div>
    </div>
    <div id="sheet" class="sheet-wrap" title="Scroll to zoom · drag to move · double-click to fit"></div>
    <div class="parts">
      <table>
        <thead><tr><th>#</th><th>Part</th><th>Group</th><th>Size (mm)</th><th>Miters</th><th>Sheet</th></tr></thead>
        <tbody id="parts-body"></tbody>
      </table>
    </div>
    <details class="warnings" id="warnings" hidden></details>
  </section>
</main>

<footer class="info" id="info">Select a part in either view.</footer>
<div id="print-area"></div>

<script type="module" src="app.js"></script>
</body>
</html>
